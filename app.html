<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>AIcall Business Workspace</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Inter,ui-sans-serif,system-ui}.field{width:100%;border:1px solid #e4e4e7;border-radius:10px;padding:11px 12px;font-size:13px;outline:none}.field:focus{border-color:#8b7aff}.navbtn.active{background:#f3f0ff;color:#6847d9;font-weight:600}</style></head>
<body class="min-h-screen bg-[#f7f7f9] text-zinc-900"><div id="loading" class="grid min-h-screen place-items-center text-sm text-zinc-500">Checking account…</div><div id="app" class="hidden min-h-screen flex flex-col md:flex-row"><aside class="w-full shrink-0 border-b border-zinc-200 bg-white p-4 md:w-64 md:border-b-0 md:border-r md:p-5"><a href="/" class="flex items-center gap-2 text-lg font-bold tracking-tight"><span class="grid h-10 w-10 place-items-center rounded-[14px] bg-gradient-to-br from-violet-400 to-indigo-600 text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10v4m3-7v10m3-13v16m3-10v4m3-16v20m3-13v10m3-7v4"/></svg></span>AIcall<span class="text-violet-500">.</span></a><div class="mt-9 rounded-xl border border-zinc-100 bg-zinc-50 p-3"><div id="companyLabel" class="truncate text-xs font-semibold">My business</div><div id="emailLabel" class="mt-1 truncate text-[10px] text-zinc-500"></div></div><nav id="nav" class="mt-6 space-y-1"></nav><button id="logout" class="mt-8 w-full rounded-lg border border-zinc-200 px-3 py-2 text-left text-xs text-zinc-600">Log out</button></aside><main class="min-w-0 flex-1 p-5 md:p-9"><div class="mx-auto max-w-6xl"><div class="flex items-center justify-between"><div><div class="text-[10px] font-semibold uppercase tracking-widest text-violet-600">AIcall · for auto shops</div><h1 id="title" class="mt-2 text-2xl font-semibold tracking-tight">Overview</h1></div><span id="planBadge" class="rounded-full bg-amber-50 px-3 py-1.5 text-[10px] font-semibold text-amber-700">Plan activation required</span></div><div id="notice" class="mt-5 hidden rounded-xl border px-4 py-3 text-xs"></div><section id="content" class="mt-6"></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const labels=['Overview','Calendar','Calls','Specialists','Services','Inventory','Phone setup','Business info & FAQs','Plan & billing','Settings'];const tables={Specialists:'specialists',Services:'business_services',Inventory:'business_inventory','Business info & FAQs':'business_faq'};let sb,user,company,active='Overview';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notice(text,bad=false){$('#notice').textContent=text;$('#notice').className='mt-5 rounded-xl border px-4 py-3 text-xs '+(bad?'border-rose-200 bg-rose-50 text-rose-700':'border-violet-200 bg-violet-50 text-violet-800')}
async function init(){try{const cfg=await (await fetch('/api/public-config')).json();if(!cfg.supabaseUrl||!cfg.supabasePublicKey)throw Error('Account system is not configured.');sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublicKey);const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href='/auth.html?mode=login';return}user=u;$('#emailLabel').textContent=u.email;const {data,error}=await sb.from('companies').select('*').limit(1).maybeSingle();if(error)throw error;company=data;$('#loading').classList.add('hidden');$('#app').classList.remove('hidden');$('#nav').innerHTML=labels.map((x,i)=>`<button class="navbtn w-full rounded-lg px-3 py-2.5 text-left text-[11px] text-zinc-600 ${x===active?'active':''}" data-label="${esc(x)}">${esc(x)}</button>`).join('');$('#nav').onclick=e=>{let b=e.target.closest('[data-label]');if(b){active=b.dataset.label;render()}};$('#logout').onclick=async()=>{await sb.auth.signOut();location.href='/'};if(company)$('#companyLabel').textContent=company.name;else active='Business info & FAQs';$('#planBadge').textContent=company?.plan_code&&company.plan_code!=='pending'?'Plan active':'Payment not confirmed';render()}catch(e){$('#loading').innerHTML=`Could not open the account: ${esc(e.message)} <a class="text-violet-600" href="/auth.html?mode=login">Log in</a>`}}
function input(label,name,type='text',value=''){return `<label class="block text-xs font-medium text-zinc-700">${label}<input class="field mt-2" name="${name}" type="${type}" value="${esc(value)}" ${name==='name'?'required':''}></label>`}function formCard(title,fields,btn='Save'){return `<form id="dataForm" class="rounded-2xl border border-zinc-200 bg-white p-5 md:p-6"><h2 class="mb-5 text-sm font-semibold">${title}</h2><div class="grid gap-4 sm:grid-cols-2">${fields}</div><button class="mt-5 rounded-xl bg-zinc-900 px-4 py-3 text-xs font-semibold text-white">${btn}</button></form>`}function empty(text){return `<div class="rounded-2xl border border-dashed border-zinc-300 bg-white p-9 text-center text-xs leading-6 text-zinc-500">${text}</div>`}
async function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.label===active));$('#title').textContent=active;$('#notice').classList.add('hidden');if(active==='Business info & FAQs'&&!company){$('#content').innerHTML=`<p class="mb-5 max-w-2xl text-xs leading-6 text-zinc-500">Start with your business details. You can add services, specialists, and approved answers next, and update them later.</p>${formCard('Business details',input('Business name','name')+input('Address','address')+input('Business phone number','phone','tel')+input('Opening hours (e.g. Mon–Fri, 8:00 am–6:00 pm)','hours')+input('Staff contact for unresolved requests','unresolved_contact','tel'))}`;$('#dataForm').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.currentTarget));try{const{data,error}=await sb.from('companies').insert({name:f.name,address:f.address,phone:f.phone,opening_hours:{display:f.hours},unresolved_contact:f.unresolved_contact}).select().single();if(error)throw error;company=data;$('#companyLabel').textContent=data.name;active='Overview';render();notice('Business profile created. Next, add services, specialists, and approved answers.')}catch(x){notice(x.message,true)}};return}
if(!company){$('#content').innerHTML=empty('Start with your business details.');return}
if(active==='Overview'){const [calls,appointments,specialists]=await Promise.all([sb.from('business_calls').select('*',{count:'exact'}).eq('company_id',company.id).order('created_at',{ascending:false}).limit(5),sb.from('appointments').select('*',{count:'exact'}).eq('company_id',company.id).gte('starts_at',new Date().toISOString()).order('starts_at',{ascending:true}).limit(5),sb.from('specialists').select('id',{count:'exact',head:true}).eq('company_id',company.id).eq('active',true)]);$('#content').innerHTML=`<div class="grid gap-3 sm:grid-cols-3">${[['Calls',calls.count||0],['Upcoming appointments',appointments.count||0],['Active specialists',specialists.count||0]].map(([a,b])=>`<div class="rounded-2xl border border-zinc-200 bg-white p-5"><div class="text-xs text-zinc-500">${a}</div><div class="mt-3 text-3xl font-semibold">${b}</div></div>`).join('')}</div><div class="mt-4 grid gap-4 lg:grid-cols-2">${calls.data?.length?calls.data.map(r=>`<div class="mb-2 rounded-xl border bg-white p-4 text-xs"><b>${esc(r.customer_name||'Customer')}</b><div class="mt-1 text-zinc-500">${esc(r.customer_phone)} · ${esc(r.summary)}</div></div>`).join(''):empty('No call records yet.')}${appointments.data?.length?appointments.data.map(r=>`<div class="mb-2 rounded-xl border bg-white p-4 text-xs"><b>${esc(r.customer_name)}</b><div class="mt-1 text-zinc-500">${esc(r.service_name)} · ${esc(r.starts_at)}</div></div>`).join(''):empty('No appointments scheduled yet.')}</div><div class="mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-xs leading-5 text-amber-900">Phone service is not configured yet. Call logs will appear when telephony is connected.</div>`;return}
if(active==='Calendar'||active==='Calls'){const t=active==='Calendar'?'appointments':'business_calls';const{data,error}=await sb.from(t).select('*').eq('company_id',company.id).order(active==='Calendar'?'starts_at':'created_at',{ascending:true}).limit(100);$('#content').innerHTML=error?empty(esc(error.message)):data.length?`<div class="overflow-x-auto rounded-2xl border bg-white"><table class="w-full text-left text-xs"><tbody>${data.map(r=>`<tr class="border-b"><td class="p-4">${esc(r.customer_name||'Customer')}</td><td class="p-4">${esc(r.service_name||r.summary||'')}</td><td class="p-4">${esc(r.starts_at||r.created_at)}</td></tr>`).join('')}</tbody></table></div>`:empty(active==='Calendar'?'No appointments booked yet.':'No call records yet.');return}
if(active==='Inventory'&&company.plan_code!=='warehouse'){$('#content').innerHTML=`<div class="rounded-2xl border border-zinc-200 bg-white p-6"><h2 class="text-sm font-semibold">Inventory is inactive</h2><p class="mt-3 text-xs leading-6 text-zinc-500">Inventory is part of the warehouse plan. Payments are not configured yet, so this feature cannot be activated in this deployment.</p><a href="/\#pricing" class="mt-4 inline-block rounded-xl border px-4 py-3 text-xs">Contact us about the plan</a></div>`;return}
if(tables[active]){const table=tables[active],{data,error}=await sb.from(table).select('*').eq('company_id',company.id).order('created_at',{ascending:false}).limit(100);const cols=active==='Services'?input('Service name','name')+input('Price (€)','price','number')+input('Duration (min.)','duration','number'):active==='Specialists'?input('Specialist name','name')+input('Qualifications','qualifications')+input('Working schedule','schedule')+input('Unavailable periods','unavailable_periods'):active==='Inventory'?input('Product name','product_name')+input('SKU','sku')+input('Quantity','quantity','number'):input('Common question','question')+input('Approved answer','answer');$('#content').innerHTML=formCard(`Add: ${active}`,cols,'Add record')+(error?empty(esc(error.message)):data.length?`<div class="mt-4 space-y-2">${data.map(row=>`<div class="rounded-xl border bg-white p-4 text-xs">${esc(row.name||row.product_name||row.question)}${row.price_eur!=null?' · '+esc(row.price_eur)+' €':''}${row.duration_minutes?' · '+esc(row.duration_minutes)+' min.':''}${row.quantity!=null?' · Stock: '+esc(row.quantity):''}${row.qualifications?' · '+esc(row.qualifications):''}</div>`).join('')}</div>`:empty(`No records yet in „${active}“.`));$('#dataForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));let row={company_id:company.id};if(active==='Services')Object.assign(row,{name:f.name,price_eur:f.price?Number(f.price):null,duration_minutes:Number(f.duration||30)});if(active==='Specialists')Object.assign(row,{name:f.name,qualifications:f.qualifications,working_schedule:{display:f.schedule},unavailable_periods:{display:f.unavailable_periods}});if(active==='Inventory')Object.assign(row,{product_name:f.product_name,sku:f.sku,quantity:Number(f.quantity||0)});if(active==='Business info & FAQs')Object.assign(row,{question:f.question,answer:f.answer});const{error}=await sb.from(table).insert(row);if(error)notice(error.message,true);else render()};return}
if(active==='Phone setup'){$('#content').innerHTML=`<div class="rounded-2xl border border-zinc-200 bg-white p-6"><h2 class="text-sm font-semibold">Phone setup</h2><p class="mt-3 text-xs leading-6 text-zinc-500">No telephony provider is connected to this account. Call handling is inactive.</p><span class="mt-4 inline-flex rounded-full bg-zinc-100 px-3 py-1.5 text-[10px] font-semibold text-zinc-600">Not connected</span></div>`;return}
if(active==='Plan & billing'){$('#content').innerHTML=`<div class="rounded-2xl border border-zinc-200 bg-white p-6"><h2 class="text-sm font-semibold">${company.plan_code==='pending'?'Plan activation required':'Active plan'}</h2><p class="mt-3 text-xs leading-6 text-zinc-500">Selected plan: ${esc(new URLSearchParams(location.search).get('plan')||company.plan_code)}. Payment provider is not configured; paid features are inactive.</p><p class="mt-2 text-xs text-zinc-500">The platform administrator sets the inventory plan price. If no price is configured, contact us for pricing.</p><a href="/#pricing" class="mt-4 inline-block rounded-xl bg-zinc-900 px-4 py-3 text-xs font-semibold text-white">View plans</a></div>`;return}
if(active==='Settings'){$('#content').innerHTML=formCard('Business information',input('Business name','name','text',company.name)+input('Address','address','text',company.address)+input('Phone number','phone','tel',company.phone)+input('Opening hours','hours','text',company.opening_hours?.display||'')+input('Contact for unresolved requests','unresolved_contact','tel',company.unresolved_contact),'Save changes');$('#dataForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));const{error}=await sb.from('companies').update({name:f.name,address:f.address,phone:f.phone,opening_hours:{...company.opening_hours,display:f.hours},unresolved_contact:f.unresolved_contact,updated_at:new Date().toISOString()}).eq('id',company.id);if(error)notice(error.message,true);else{company={...company,...f,opening_hours:{...company.opening_hours,display:f.hours}};$('#companyLabel').textContent=company.name;notice('Changes saved.')}};return}
}
init();
</script></body></html>
