<!doctype html>
<html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>AIcall verslo aplinka</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Inter,ui-sans-serif,system-ui}.field{width:100%;border:1px solid #e4e4e7;border-radius:10px;padding:11px 12px;font-size:13px;outline:none}.field:focus{border-color:#8b7aff}.navbtn.active{background:#f3f0ff;color:#6847d9;font-weight:600}</style></head>
<body class="min-h-screen bg-[#f7f7f9] text-zinc-900"><div id="loading" class="grid min-h-screen place-items-center text-sm text-zinc-500">Tikrinama paskyra…</div><div id="app" class="hidden min-h-screen flex flex-col md:flex-row"><aside class="w-full shrink-0 border-b border-zinc-200 bg-white p-4 md:w-64 md:border-b-0 md:border-r md:p-5"><a href="/" class="flex items-center gap-2 text-lg font-bold tracking-tight"><span class="grid h-8 w-8 place-items-center rounded-xl bg-violet-600 text-white">◖</span>AIcall<span class="text-violet-500">.</span></a><div class="mt-9 rounded-xl border border-zinc-100 bg-zinc-50 p-3"><div id="companyLabel" class="truncate text-xs font-semibold">Mano įmonė</div><div id="emailLabel" class="mt-1 truncate text-[10px] text-zinc-500"></div></div><nav id="nav" class="mt-6 space-y-1"></nav><button id="logout" class="mt-8 w-full rounded-lg border border-zinc-200 px-3 py-2 text-left text-xs text-zinc-600">Atsijungti</button></aside><main class="min-w-0 flex-1 p-5 md:p-9"><div class="mx-auto max-w-6xl"><div class="flex items-center justify-between"><div><div class="text-[10px] font-semibold uppercase tracking-widest text-violet-600">AIcall · autoservisams</div><h1 id="title" class="mt-2 text-2xl font-semibold tracking-tight">Apžvalga</h1></div><span id="planBadge" class="rounded-full bg-amber-50 px-3 py-1.5 text-[10px] font-semibold text-amber-700">Planą reikia aktyvuoti</span></div><div id="notice" class="mt-5 hidden rounded-xl border px-4 py-3 text-xs"></div><section id="content" class="mt-6"></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const labels=['Apžvalga','Kalendorius','Skambučiai','Specialistai','Paslaugos','Sandėlis','Telefono prijungimas','Verslo informacija ir DUK','Planas ir mokėjimai','Nustatymai'];const tables={Specialistai:'specialists',Paslaugos:'business_services',Sandėlis:'business_inventory','Verslo informacija ir DUK':'business_faq'};let sb,user,company,active='Apžvalga';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notice(text,bad=false){$('#notice').textContent=text;$('#notice').className='mt-5 rounded-xl border px-4 py-3 text-xs '+(bad?'border-rose-200 bg-rose-50 text-rose-700':'border-violet-200 bg-violet-50 text-violet-800')}
async function init(){try{const cfg=await (await fetch('/api/public-config')).json();if(!cfg.supabaseUrl||!cfg.supabasePublicKey)throw Error('Paskyrų sistema nesukonfigūruota.');sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublicKey);const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href='/auth.html?mode=login';return}user=u;$('#emailLabel').textContent=u.email;const {data,error}=await sb.from('companies').select('*').limit(1).maybeSingle();if(error)throw error;company=data;$('#loading').classList.add('hidden');$('#app').classList.remove('hidden');$('#nav').innerHTML=labels.map((x,i)=>`<button class="navbtn w-full rounded-lg px-3 py-2.5 text-left text-[11px] text-zinc-600 ${x===active?'active':''}" data-label="${esc(x)}">${esc(x)}</button>`).join('');$('#nav').onclick=e=>{let b=e.target.closest('[data-label]');if(b){active=b.dataset.label;render()}};$('#logout').onclick=async()=>{await sb.auth.signOut();location.href='/'};if(company)$('#companyLabel').textContent=company.name;else active='Verslo informacija ir DUK';$('#planBadge').textContent=company?.plan_code&&company.plan_code!=='pending'?'Planas aktyvus':'Mokėjimas dar nepatvirtintas';render()}catch(e){$('#loading').innerHTML=`Nepavyko atverti paskyros: ${esc(e.message)} <a class="text-violet-600" href="/auth.html?mode=login">Prisijungti</a>`}}
function input(label,name,type='text',value=''){return `<label class="block text-xs font-medium text-zinc-700">${label}<input class="field mt-2" name="${name}" type="${type}" value="${esc(value)}" ${name==='name'?'required':''}></label>`}function formCard(title,fields,btn='Išsaugoti'){return `<form id="dataForm" class="rounded-2xl border border-zinc-200 bg-white p-5 md:p-6"><h2 class="mb-5 text-sm font-semibold">${title}</h2><div class="grid gap-4 sm:grid-cols-2">${fields}</div><button class="mt-5 rounded-xl bg-zinc-900 px-4 py-3 text-xs font-semibold text-white">${btn}</button></form>`}function empty(text){return `<div class="rounded-2xl border border-dashed border-zinc-300 bg-white p-9 text-center text-xs leading-6 text-zinc-500">${text}</div>`}
async function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.label===active));$('#title').textContent=active;$('#notice').classList.add('hidden');if(active==='Verslo informacija ir DUK'&&!company){$('#content').innerHTML=`<p class="mb-5 max-w-2xl text-xs leading-6 text-zinc-500">Pradėkime nuo įmonės informacijos. Vėliau galėsi čia ją redaguoti ir papildyti paslaugomis, specialistais bei patvirtintais atsakymais.</p>${formCard('Įmonės duomenys',input('Autoserviso pavadinimas','name')+input('Adresas','address')+input('Verslo telefono numeris','phone','tel')+input('Darbo laikas (pvz., I–V 08:00–18:00)','hours')+input('Darbuotojo kontaktas neaiškiems prašymams','unresolved_contact','tel'))}`;$('#dataForm').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.currentTarget));try{const{data,error}=await sb.from('companies').insert({name:f.name,address:f.address,phone:f.phone,opening_hours:{display:f.hours},unresolved_contact:f.unresolved_contact}).select().single();if(error)throw error;company=data;$('#companyLabel').textContent=data.name;active='Apžvalga';render();notice('Įmonės profilis sukurtas. Toliau pridėkite paslaugas, specialistus ir patvirtintus atsakymus.')}catch(x){notice(x.message,true)}};return}
if(!company){$('#content').innerHTML=empty('Pradėkite nuo įmonės informacijos.');return}
if(active==='Apžvalga'){const [calls,appointments,specialists]=await Promise.all([sb.from('business_calls').select('*',{count:'exact'}).eq('company_id',company.id).order('created_at',{ascending:false}).limit(5),sb.from('appointments').select('*',{count:'exact'}).eq('company_id',company.id).gte('starts_at',new Date().toISOString()).order('starts_at',{ascending:true}).limit(5),sb.from('specialists').select('id',{count:'exact',head:true}).eq('company_id',company.id).eq('active',true)]);$('#content').innerHTML=`<div class="grid gap-3 sm:grid-cols-3">${[['Skambučiai',calls.count||0],['Artimiausi vizitai',appointments.count||0],['Aktyvūs specialistai',specialists.count||0]].map(([a,b])=>`<div class="rounded-2xl border border-zinc-200 bg-white p-5"><div class="text-xs text-zinc-500">${a}</div><div class="mt-3 text-3xl font-semibold">${b}</div></div>`).join('')}</div><div class="mt-4 grid gap-4 lg:grid-cols-2">${calls.data?.length?calls.data.map(r=>`<div class="mb-2 rounded-xl border bg-white p-4 text-xs"><b>${esc(r.customer_name||'Klientas')}</b><div class="mt-1 text-zinc-500">${esc(r.customer_phone)} · ${esc(r.summary)}</div></div>`).join(''):empty('Kol kas nėra skambučių įrašų.')}${appointments.data?.length?appointments.data.map(r=>`<div class="mb-2 rounded-xl border bg-white p-4 text-xs"><b>${esc(r.customer_name)}</b><div class="mt-1 text-zinc-500">${esc(r.service_name)} · ${esc(r.starts_at)}</div></div>`).join(''):empty('Kol kas nėra suplanuotų vizitų.')}</div><div class="mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-xs leading-5 text-amber-900">Telefono prijungimas dar nesukonfigūruotas. Skambučių žurnalas pildysis, kai bus prijungta telefonijos paslauga.</div>`;return}
if(active==='Kalendorius'||active==='Skambučiai'){const t=active==='Kalendorius'?'appointments':'business_calls';const{data,error}=await sb.from(t).select('*').eq('company_id',company.id).order(active==='Kalendorius'?'starts_at':'created_at',{ascending:true}).limit(100);$('#content').innerHTML=error?empty(esc(error.message)):data.length?`<div class="overflow-x-auto rounded-2xl border bg-white"><table class="w-full text-left text-xs"><tbody>${data.map(r=>`<tr class="border-b"><td class="p-4">${esc(r.customer_name||'Klientas')}</td><td class="p-4">${esc(r.service_name||r.summary||'')}</td><td class="p-4">${esc(r.starts_at||r.created_at)}</td></tr>`).join('')}</tbody></table></div>`:empty(active==='Kalendorius'?'Kol kas nėra rezervuotų vizitų.':'Kol kas nėra skambučių įrašų.');return}
if(active==='Sandėlis'&&company.plan_code!=='warehouse'){$('#content').innerHTML=`<div class="rounded-2xl border border-zinc-200 bg-white p-6"><h2 class="text-sm font-semibold">Sandėlio funkcija neaktyvi</h2><p class="mt-3 text-xs leading-6 text-zinc-500">Ši funkcija priklauso sandėlio planui. Mokėjimų teikėjas dar nesukonfigūruotas, todėl funkcijos negalima aktyvuoti šiame diegime.</p><a href="/\#pricing" class="mt-4 inline-block rounded-xl border px-4 py-3 text-xs">Susisiekti dėl plano</a></div>`;return}
if(tables[active]){const table=tables[active],{data,error}=await sb.from(table).select('*').eq('company_id',company.id).order('created_at',{ascending:false}).limit(100);const cols=active==='Paslaugos'?input('Paslaugos pavadinimas','name')+input('Kaina (€)','price','number')+input('Trukmė (min.)','duration','number'):active==='Specialistai'?input('Specialisto vardas','name')+input('Kvalifikacija','qualifications')+input('Darbo grafikas','schedule')+input('Nedarbo laikotarpiai','unavailable_periods'):active==='Sandėlis'?input('Prekės pavadinimas','product_name')+input('SKU','sku')+input('Kiekis','quantity','number'):input('Dažnas klausimas','question')+input('Patvirtintas atsakymas','answer');$('#content').innerHTML=formCard(`Pridėti: ${active}`,cols,'Pridėti įrašą')+(error?empty(esc(error.message)):data.length?`<div class="mt-4 space-y-2">${data.map(row=>`<div class="rounded-xl border bg-white p-4 text-xs">${esc(row.name||row.product_name||row.question)}${row.price_eur!=null?' · '+esc(row.price_eur)+' €':''}${row.duration_minutes?' · '+esc(row.duration_minutes)+' min.':''}${row.quantity!=null?' · Likutis: '+esc(row.quantity):''}${row.qualifications?' · '+esc(row.qualifications):''}</div>`).join('')}</div>`:empty(`Dar nėra įrašų skiltyje „${active}“.`));$('#dataForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));let row={company_id:company.id};if(active==='Paslaugos')Object.assign(row,{name:f.name,price_eur:f.price?Number(f.price):null,duration_minutes:Number(f.duration||30)});if(active==='Specialistai')Object.assign(row,{name:f.name,qualifications:f.qualifications,working_schedule:{display:f.schedule},unavailable_periods:{display:f.unavailable_periods}});if(active==='Sandėlis')Object.assign(row,{product_name:f.product_name,sku:f.sku,quantity:Number(f.quantity||0)});if(active==='Verslo informacija ir DUK')Object.assign(row,{question:f.question,answer:f.answer});const{error}=await sb.from(table).insert(row);if(error)notice(error.message,true);else render()};return}
if(active==='Telefono prijungimas'){$('#content').innerHTML=`<div class="rounded-2xl border border-zinc-200 bg-white p-6"><h2 class="text-sm font-semibold">Telefono prijungimas</h2><p class="mt-3 text-xs leading-6 text-zinc-500">Telefonijos tiekėjas dar nėra prijungtas prie šios paskyros. Skambučių priėmimo paslauga neaktyvi.</p><span class="mt-4 inline-flex rounded-full bg-zinc-100 px-3 py-1.5 text-[10px] font-semibold text-zinc-600">Neprijungta</span></div>`;return}
if(active==='Planas ir mokėjimai'){$('#content').innerHTML=`<div class="rounded-2xl border border-zinc-200 bg-white p-6"><h2 class="text-sm font-semibold">${company.plan_code==='pending'?'Planą reikia aktyvuoti':'Aktyvus planas'}</h2><p class="mt-3 text-xs leading-6 text-zinc-500">Pasirinktas planas: ${esc(new URLSearchParams(location.search).get('plan')||company.plan_code)}. Mokėjimų tiekėjas dar nenustatytas; mokamos funkcijos neaktyvuotos.</p><p class="mt-2 text-xs text-zinc-500">Sandėlio plano kainą nustato platformos administratorius. Jei kaina nenustatyta, susisiekite dėl kainos.</p><a href="/#pricing" class="mt-4 inline-block rounded-xl bg-zinc-900 px-4 py-3 text-xs font-semibold text-white">Peržiūrėti planus</a></div>`;return}
if(active==='Nustatymai'){$('#content').innerHTML=formCard('Įmonės informacija',input('Autoserviso pavadinimas','name','text',company.name)+input('Adresas','address','text',company.address)+input('Telefono numeris','phone','tel',company.phone)+input('Darbo laikas','hours','text',company.opening_hours?.display||'')+input('Neišspręstų užklausų kontaktas','unresolved_contact','tel',company.unresolved_contact),'Išsaugoti pakeitimus');$('#dataForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));const{error}=await sb.from('companies').update({name:f.name,address:f.address,phone:f.phone,opening_hours:{...company.opening_hours,display:f.hours},unresolved_contact:f.unresolved_contact,updated_at:new Date().toISOString()}).eq('id',company.id);if(error)notice(error.message,true);else{company={...company,...f,opening_hours:{...company.opening_hours,display:f.hours}};$('#companyLabel').textContent=company.name;notice('Pakeitimai išsaugoti.')}};return}
}
init();
</script></body></html>
