<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <meta name="robots" content="noindex" />
  <title>AIcall Demo — Summit Auto Care</title>
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui; }
    .field { width: 100%; border: 1px solid #e4e4e7; border-radius: 10px; padding: 9px 11px; font-size: 13px; outline: none; background: #fff; }
    .field:focus { border-color: #8b7aff; box-shadow: 0 0 0 3px rgba(139,122,255,.15); }
    .field[aria-invalid="true"] { border-color: #f43f5e; }
    .navbtn { display:flex; align-items:center; gap:10px; width:100%; border-radius:10px; padding:9px 12px; text-align:left; font-size:12px; color:#52525b; transition: background .15s; }
    .navbtn:hover { background:#f4f4f5; }
    .navbtn.active { background:#f3f0ff; color:#6847d9; font-weight:600; }
    .btn { border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 600; transition: background .15s, opacity .15s; display:inline-flex; align-items:center; gap:6px; justify-content:center; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-primary { background:#18181b; color:#fff; } .btn-primary:hover:not(:disabled) { background:#27272a; }
    .btn-violet { background:#6847d9; color:#fff; } .btn-violet:hover:not(:disabled) { background:#5a3bc4; }
    .btn-ghost { border:1px solid #e4e4e7; background:#fff; color:#3f3f46; } .btn-ghost:hover:not(:disabled) { background:#f4f4f5; }
    .btn-danger { border:1px solid #fecdd3; background:#fff; color:#be123c; } .btn-danger:hover:not(:disabled) { background:#fff1f2; }
    .card { border:1px solid #e4e4e7; background:#fff; border-radius:16px; min-width:0; }
    main#content > div > *, main#content section { min-width:0; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .pill { display:inline-flex; align-items:center; border-radius:999px; padding:2px 9px; font-size:10px; font-weight:600; white-space:nowrap; }
    th { text-align:left; font-weight:600; } 
    :focus-visible { outline: 2px solid #8b7aff; outline-offset: 2px; }
    .chip { transition: filter .15s; cursor:pointer; text-align:left; } .chip:hover { filter: brightness(.96); }
    .scroll-thin { scrollbar-width: thin; }
    .spin { width:16px; height:16px; border:2px solid #d4d4d8; border-top-color:#6847d9; border-radius:50%; animation: sp .7s linear infinite; display:inline-block; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .bubble-ai { background:#f3f0ff; color:#27272a; } .bubble-c { background:#18181b; color:#fff; }
    .login-bg { background: radial-gradient(circle at 20% 10%, rgba(124,92,245,.35), transparent 45%), radial-gradient(circle at 85% 90%, rgba(76,29,149,.4), transparent 45%), #09090b; }
    pre.wrap { white-space: pre-wrap; font-family: inherit; }
  </style>
</head>
<body class="min-h-screen bg-[#f7f7f9] text-zinc-900">
  <div id="loading" class="grid min-h-screen place-items-center text-sm text-zinc-500"><span class="spin"></span></div>

  <!-- ===== Portal ===== -->
  <div id="portal" class="hidden min-h-screen md:flex">
    <aside class="w-full shrink-0 border-b border-zinc-200 bg-white p-4 md:sticky md:top-0 md:h-screen md:w-60 md:overflow-y-auto md:border-b-0 md:border-r md:p-5">
      <div class="flex items-center justify-between md:block">
        <a href="/" class="flex items-center gap-2.5 text-[16px] font-semibold tracking-[-.02em]" title="Back to the website"><img src="/logo-mark.svg" alt="" class="h-8 w-8" /><span><span class="text-violet-600">AI</span>call</span></a>
        <button id="menuBtn" class="btn btn-ghost md:hidden" aria-expanded="false" aria-controls="menuWrap">Menu</button>
      </div>
      <div class="mt-4 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[10px] leading-4 text-amber-900"><b>DEMO</b> · Summit Auto Care<br />Fictional data, safe to edit.</div>
      <div id="menuWrap" class="hidden md:block">
      <nav id="nav" class="mt-4 space-y-0.5" aria-label="Portal"></nav>
      <div class="mt-5 border-t border-zinc-100 pt-4" id="sideFoot">
        <div class="text-[10px] text-zinc-400" id="whoami"></div>
        <button id="resetBtn" class="mt-2 text-[11px] font-medium text-zinc-500 hover:text-zinc-800">Reset demo data</button>
        <div class="mt-3 flex flex-col gap-2"><a href="/" class="btn btn-ghost">← Back to website</a><button id="logoutBtn" class="btn btn-primary">Log out</button></div>
      </div>
      </div>
    </aside>
    <div class="min-w-0 flex-1">
      <header class="flex items-center justify-between gap-3 border-b border-zinc-200 bg-white px-4 py-3.5 md:px-8">
        <div><h1 id="title" class="text-base font-semibold tracking-tight"></h1><p id="subtitle" class="text-[11px] text-zinc-500"></p></div>
        <div id="headerActions" class="flex flex-wrap items-center gap-2"></div>
      </header>
      <main id="content" class="p-4 md:p-8" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-zinc-950/40 p-3 md:p-6" role="presentation">
    <div id="modalCard" class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-2xl border border-zinc-200 bg-white p-5 shadow-2xl md:p-6" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex max-w-sm flex-col gap-2" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '€' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const TOKEN_KEY = 'aicall_demo_token';
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const pretty = (s) => { const d = parse(s); return `${DAYS[d.getDay()].slice(0, 3)}, ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`; };
  const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
  const fromMin = (n) => `${pad(Math.floor(n / 60))}:${pad(n % 60)}`;
  const weekStart = (s) => { const wd = parse(s).getDay(); return addDays(s, wd === 0 ? -6 : 1 - wd); };

  const S = { view: 'dashboard', meta: null, today: null, cal: { mode: 'week', date: null }, mechFilter: '', pending: 0 };

  // ------------------------------------------------------------- api
  class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }
  async function api(path, opts = {}) {
    const headers = { Accept: 'application/json' };
    const token = sessionStorage.getItem(TOKEN_KEY);
    if (token) headers.Authorization = 'Bearer ' + token;
    if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
    let res;
    try { res = await fetch('/api/demo' + path, { method: opts.method || 'GET', headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined }); }
    catch { throw new ApiError('Cannot reach the server. Check your connection and try again.', 0); }
    let data = null;
    try { data = await res.json(); } catch { /* empty */ }
    if (res.status === 401 && path !== '/login') { sessionStorage.removeItem(TOKEN_KEY); showLogin(); throw new ApiError('Session expired.', 401); }
    if (!res.ok) throw new ApiError((data && data.error) || `Request failed (${res.status}).`, res.status);
    return data;
  }
  const qs = (o) => { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v !== '' && v != null) p.set(k, v); const s = p.toString(); return s ? '?' + s : ''; };

  function toast(msg, kind = 'ok') {
    const el = document.createElement('div');
    el.className = `pointer-events-auto rounded-xl border px-4 py-3 text-xs shadow-lg ${kind === 'err' ? 'border-rose-200 bg-rose-50 text-rose-800' : 'border-emerald-200 bg-emerald-50 text-emerald-900'}`;
    el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), kind === 'err' ? 7000 : 3800);
  }
  async function act(btn, fn, okMsg) {
    if (btn) btn.disabled = true;
    try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
    catch (e) { if (e.status !== 401) toast(e.message, 'err'); return undefined; }
    finally { if (btn && btn.isConnected) btn.disabled = false; }
  }

  // ---------------------------------------------------------- badges
  const TONE = { green: 'bg-emerald-100 text-emerald-800', amber: 'bg-amber-100 text-amber-800', red: 'bg-rose-100 text-rose-800', violet: 'bg-violet-100 text-violet-800', zinc: 'bg-zinc-100 text-zinc-700', blue: 'bg-sky-100 text-sky-800' };
  const pill = (text, tone = 'zinc') => `<span class="pill ${TONE[tone]}">${esc(text)}</span>`;
  const STATUS = {
    confirmed: ['Confirmed', 'green'], pending: ['Awaiting confirmation', 'amber'], completed: ['Completed', 'zinc'], cancelled: ['Cancelled', 'red'], no_show: ['No-show', 'red'],
    missed: ['Missed', 'red'], new_inquiry: ['New inquiry', 'blue'], follow_up: ['Follow-up', 'violet'],
    in_stock: ['In stock', 'green'], low_stock: ['Low stock', 'amber'], out_of_stock: ['Out of stock', 'red'], fully_reserved: ['Reserved for a repair', 'violet'],
    requested: ['Requested', 'blue'], pending_inspection: ['Awaiting inspection', 'amber'], awaiting_parts: ['Awaiting parts', 'red'], scheduled: ['Scheduled', 'green'], in_progress: ['In progress', 'violet'], ready: ['Ready for repair', 'green'],
    awaiting_verification: ['Awaiting inventory verification', 'amber'], parts_required: ['Parts required', 'red'], awaiting_price_confirmation: ['Awaiting price confirmation', 'amber'], awaiting_approval: ['Awaiting human approval', 'amber'],
    approved: ['Approved for manual ordering', 'blue'], ordered: ['Ordered by authorised human', 'violet'], received: ['Parts received', 'green'], ready_for_repair: ['Ready for repair', 'green'],
  };
  const badge = (s) => { const [t, tone] = STATUS[s] || [s, 'zinc']; return pill(t, tone); };
  const KIND = { service: ['Service', 'zinc'], inspection: ['Inspection', 'amber'], repair: ['Repair', 'violet'] };
  const kindBadge = (k) => pill(...(KIND[k] || [k, 'zinc']));
  const simBadge = (c) => c.simulated ? pill('Simulated demo call', 'violet') : '';
  const chipColor = (b) => b.status === 'cancelled' || b.status === 'no_show' ? 'border-rose-200 bg-rose-50 text-rose-800 line-through opacity-70'
    : b.status === 'completed' ? 'border-zinc-200 bg-zinc-50 text-zinc-600'
    : b.status === 'pending' ? 'border-amber-300 bg-amber-50 text-amber-900'
    : b.kind === 'inspection' ? 'border-sky-200 bg-sky-50 text-sky-900' : 'border-violet-200 bg-violet-50 text-violet-900';

  // -------------------------------------------------------------- ui
  const empty = (t) => `<div class="rounded-2xl border border-dashed border-zinc-300 bg-white p-8 text-center text-xs text-zinc-500">${t}</div>`;
  const loading = () => `<div class="grid place-items-center p-12 text-xs text-zinc-500"><span class="spin mb-3"></span>Loading…</div>`;
  const errBox = (e, retry) => `<div class="rounded-2xl border border-rose-200 bg-rose-50 p-5 text-xs text-rose-800" role="alert"><b>Couldn't load this section.</b> ${esc(e.message)} <button class="ml-2 font-semibold underline" data-retry="${retry}">Try again</button></div>`;
  const stat = (label, value, sub, tone = '', go = '') => `<${go ? 'button' : 'div'} ${go ? `data-go="${go}"` : ''} class="card p-4 text-left ${go ? 'chip' : ''}"><div class="text-[11px] text-zinc-500">${esc(label)}</div><div class="mt-1 text-2xl font-semibold tracking-tight ${tone}">${value}</div><div class="mt-0.5 text-[10px] text-zinc-400">${sub || '&nbsp;'}</div></${go ? 'button' : 'div'}>`;
  const section = (title, body, extra = '') => `<section class="card p-4 md:p-5"><div class="mb-3 flex items-center justify-between gap-2"><h2 class="text-sm font-semibold">${esc(title)}</h2>${extra}</div>${body}</section>`;
  const field = (label, input, hint = '') => `<label class="block text-[11px] font-medium text-zinc-600">${esc(label)}<div class="mt-1">${input}</div>${hint ? `<div class="mt-0.5 text-[10px] font-normal text-zinc-400">${esc(hint)}</div>` : ''}</label>`;
  const inp = (name, v = '', o = {}) => `<input class="field" name="${name}" value="${esc(v)}" ${o.type ? `type="${o.type}"` : ''} ${o.req ? 'required' : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''} ${o.step ? `step="${o.step}"` : ''} ${o.maxlength ? `maxlength="${o.maxlength}"` : ''}>`;
  const sel = (name, opts, cur = '', o = {}) => `<select class="field" name="${name}" ${o.req ? 'required' : ''}>${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const formData = (form) => Object.fromEntries([...new FormData(form).entries()].map(([k, v]) => [k, typeof v === 'string' ? v.trim() : v]));

  function openModal(html, wide = false) {
    $('#modalCard').className = `max-h-[92vh] w-full ${wide ? 'max-w-4xl' : 'max-w-2xl'} overflow-y-auto rounded-2xl border border-zinc-200 bg-white p-5 shadow-2xl md:p-6`;
    $('#modalCard').innerHTML = html;
    $('#modal').classList.remove('hidden'); $('#modal').classList.add('flex');
    document.body.style.overflow = 'hidden';
    const f = $('#modalCard input,#modalCard select,#modalCard textarea,#modalCard button'); if (f) f.focus({ preventScroll: true });
  }
  function closeModal() { $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex'); $('#modalCard').innerHTML = ''; document.body.style.overflow = ''; }
  const modalHead = (title, sub = '') => `<div class="mb-4 flex items-start justify-between gap-3"><div><h2 class="text-base font-semibold tracking-tight">${title}</h2>${sub ? `<p class="mt-0.5 text-[11px] text-zinc-500">${sub}</p>` : ''}</div><button class="btn btn-ghost" data-close aria-label="Close">✕</button></div>`;
  $('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });
  document.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeModal(); });

  // ------------------------------------------------------------- shell
  const NAV = [
    ['dashboard', 'Dashboard', '▦'], ['agent', 'AI receptionist', '☎'], ['calls', 'Call history', '✆'], ['calendar', 'Calendar', '▤'],
    ['customers', 'Customers & vehicles', '☺'], ['inventory', 'Inventory', '▣'], ['requests', 'Parts requests', '⚑'], ['jobs', 'Jobs & tasks', '✓'],
  ];
  const TITLES = {
    dashboard: ['Dashboard', 'Live overview of the workshop and your AI receptionist'], agent: ['AI receptionist', 'Run a simulated incoming call end to end'], calls: ['Call history', 'Every call with AI summaries and transcripts'],
    calendar: ['Workshop calendar', 'Appointments by mechanic, with conflict protection'], customers: ['Customers & vehicles', 'Searchable customer and vehicle records'], inventory: ['Inventory', 'Stock, reservations and movements'],
    requests: ['Parts requests', 'Proposed purchases that need a human decision'], jobs: ['Jobs & tasks', 'Repair jobs and workshop to-dos'],
  };
  function renderNav() {
    $('#nav').innerHTML = NAV.map(([id, label, ic]) => `<button class="navbtn ${S.view === id ? 'active' : ''}" data-view="${id}" ${S.view === id ? 'aria-current="page"' : ''}><span aria-hidden="true" class="w-4 text-center">${ic}</span>${label}</button>`).join('');
  }
  $('#nav').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) { go(b.dataset.view); $('#menuWrap').classList.add('hidden'); $('#menuBtn').setAttribute('aria-expanded', 'false'); } });
  $('#menuBtn').addEventListener('click', () => { const n = $('#menuWrap'); const open = n.classList.toggle('hidden') === false; $('#menuBtn').setAttribute('aria-expanded', String(open)); });
  document.addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });
  document.addEventListener('click', (e) => { const r = e.target.closest('[data-retry]'); if (r) go(r.dataset.retry, true); });

  async function go(view, keep = false) {
    if (!keep) { S.view = view; location.hash = view; }
    const t = TITLES[view] || ['', '']; $('#title').textContent = t[0]; $('#subtitle').textContent = t[1]; $('#headerActions').innerHTML = '';
    renderNav(); document.title = `${t[0]} · AIcall Demo`;
    $('#content').innerHTML = loading();
    const token = ++S.pending;
    try {
      const out = await VIEWS[view]();
      if (token !== S.pending) return;
      if (typeof out === 'string') $('#content').innerHTML = out;
      if (VIEWS[view + '$after']) VIEWS[view + '$after']();
    } catch (e) { if (e.status !== 401 && token === S.pending) $('#content').innerHTML = errBox(e, view); }
  }

  const refresh = () => go(S.view, true);

  // ---------------------------------------------------------- session
  function showLogin() { sessionStorage.removeItem(TOKEN_KEY); location.replace('/auth.html?mode=login'); }
  async function showPortal() {
    S.meta = await api('/meta'); S.today = S.meta.today;
    S.cal.date = S.today;
    $('#loading').classList.add('hidden'); $('#portal').classList.remove('hidden'); $('#portal').classList.add('md:flex');
    $('#whoami').textContent = 'Signed in as demo@aicall.example';
    const v = location.hash.slice(1); S.view = VIEWS[v] ? v : 'dashboard'; go(S.view, true);
  }
  $('#logoutBtn').addEventListener('click', () => { sessionStorage.removeItem(TOKEN_KEY); location.href = '/'; });
  $('#resetBtn').addEventListener('click', async (e) => {
    if (!confirm('Reset all demo data to the original sample workshop? Your changes will be lost.')) return;
    await act(e.target, () => api('/reset', { method: 'POST', body: {} }), 'Demo data reset.'); S.meta = await api('/meta'); refresh();
  });

  // ------------------------------------------------------------ helpers
  const bookingChip = (b, compact = false) => `<button class="chip block w-full rounded-lg border px-2 py-1 text-[10px] leading-4 ${chipColor(b)}" data-booking="${b.id}" title="${esc(b.customerName)} · ${esc(b.repairType)}"><b>${b.start}</b> ${esc(b.customerName.split(' ')[0])} · ${esc(b.vehicle.split(' ').slice(1).join(' '))}${compact ? '' : `<br><span class="opacity-80">${esc(b.repairType)} · ${esc(b.mechanicName.split(' ')[0])}</span>`}${b.partsState === 'missing' && b.status !== 'cancelled' ? ' <span title="Parts missing">⚠</span>' : ''}</button>`;
  const partsLine = (c) => `<tr class="border-t border-zinc-100"><td class="py-2 pr-2">${esc(c.description)}${c.compat === 'uncertain' ? ' <span class="pill bg-amber-100 text-amber-800">fitment unverified</span>' : ''}</td><td class="py-2 pr-2 text-center">${c.qty}</td><td class="py-2 pr-2 text-center">${c.available}${c.reserved ? ` <span class="text-zinc-400">(${c.reserved} reserved)</span>` : ''}</td><td class="py-2 text-right">${c.shortfall ? pill(c.shortfall + ' short', 'red') : pill('available', 'green')}</td></tr>`;
  const partsTable = (parts) => parts.length ? `<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-[10px] uppercase tracking-wider text-zinc-400"><tr><th class="pb-1">Part</th><th class="pb-1 text-center">Qty</th><th class="pb-1 text-center">Available</th><th class="pb-1 text-right">Status</th></tr></thead><tbody>${parts.map(partsLine).join('')}</tbody></table></div>` : '<p class="text-xs text-zinc-500">No parts required.</p>';
  const kv = (k, v) => `<div><dt class="text-[10px] uppercase tracking-wider text-zinc-400">${k}</dt><dd class="mt-0.5 text-xs text-zinc-800">${v || '—'}</dd></div>`;
  const callRow = (c) => `<tr class="cursor-pointer border-t border-zinc-100 hover:bg-zinc-50" data-call="${c.id}" tabindex="0" role="button" aria-label="Open call ${esc(c.name)}"><td class="p-3 whitespace-nowrap">${pretty(c.date)}<div class="text-[10px] text-zinc-400">${c.time}</td><td class="p-3"><div class="font-medium">${esc(c.name)}</div><div class="text-[10px] text-zinc-400">${esc(c.phone)}</div></td><td class="p-3">${badge(c.status)}${c.simulated ? '<div class="mt-1">' + pill('Simulated', 'violet') + '</div>' : ''}</td><td class="hidden p-3 md:table-cell">${esc(c.vehicle)}</td><td class="hidden max-w-xs p-3 text-zinc-600 lg:table-cell"><div class="line-clamp-2">${esc(c.summary)}</div></td><td class="hidden p-3 sm:table-cell">${c.durationSec ? Math.floor(c.durationSec / 60) + ':' + pad(c.durationSec % 60) : '—'}</td><td class="p-3">${esc(c.appointmentStatus)}</td></tr>`;
  const emptyToday = (n) => n === 0 ? '' : '';
  document.addEventListener('click', (e) => { const c = e.target.closest('[data-call]'); if (c) openCall(c.dataset.call); const b = e.target.closest('[data-booking]'); if (b) openBooking(b.dataset.booking); const cu = e.target.closest('[data-customer]'); if (cu) openCustomer(cu.dataset.customer); const rq = e.target.closest('[data-request]'); if (rq) { S.focusRequest = rq.dataset.request; closeModal(); go('requests'); } });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-call][role=button]')) { e.preventDefault(); openCall(e.target.dataset.call); } });

  // ---------------------------------------------------------------- views
  const VIEWS = {};

  VIEWS.dashboard = async () => {
    const d = await api('/dashboard'); const c = d.cards;
    $('#headerActions').innerHTML = `<button class="btn btn-violet" data-go="agent">☎ Simulate incoming call</button>`;
    return `
    <div class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-5">
      ${stat('Calls today', c.callsToday, `${pretty(d.today)}`, '', 'calls')}

    else { const first = date.slice(0, 8) + '01'; from = weekStart(first); const d = parse(first); const last = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12)); to = addDays(weekStart(last), 6); }

    const label = mode === 'day' ? `${DAYS[parse(date).getDay()]}, ${pretty(date).split(', ')[1]}` : mode === 'week' ? `${pretty(from)} – ${pretty(to)}` : `${MONTHS[parse(date).getMonth()]} ${parse(date).getFullYear()}`;

    const byDate = (d) => items.filter((b) => b.date === d);

      const days = []; for (let d = from; d <= to; d = addDays(d, 1)) days.push(d);
      body = `<div class="card overflow-x-auto"><div class="grid min-w-[640px] grid-cols-7 border-b border-zinc-200 bg-zinc-50 text-center text-[10px] font-semibold uppercase tracking-wider text-zinc-500">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((x) => `<div class="p-2">${x}</div>`).join('')}</div><div class="grid min-w-[640px] grid-cols-7">${days.map((d) => { const bs = byDate(d); const other = d.slice(0, 7) !== date.slice(0, 7); return `<div class="min-h-[96px] border-b border-r border-zinc-100 p-1.5 ${other ? 'bg-zinc-50/60 text-zinc-300' : ''} ${d === S.today ? 'bg-violet-50/50' : ''}"><button class="text-[11px] font-semibold ${d === S.today ? 'text-violet-700' : ''}" data-cal-day="${d}">${parse(d).getDate()}</button><div class="mt-1 space-y-1">${bs.slice(0, 3).map((b) => bookingChip(b, true)).join('')}${bs.length > 3 ? `<button class="text-[10px] font-semibold text-violet-700" data-cal-day="${d}">+${bs.length - 3} more</button>` : ''}</div></div>`; }).join('')}</div></div>`;

        <div id="chatLog" class="scroll-thin max-h-[560px] min-h-[320px] space-y-2.5 overflow-y-auto p-4" aria-live="polite">${s.transcript.map((t) => t.role === 'system' ? `<div class="text-center text-[10px] text-zinc-400">${esc(t.text)}</div>` : `<div class="flex ${t.role === 'ai' ? '' : 'justify-end'}"><div class="max-w-[88%] rounded-2xl px-3.5 py-2.5 text-xs leading-5 ${t.role === 'ai' ? 'bubble-ai' : 'bubble-c'}"><div class="mb-0.5 text-[9px] font-semibold uppercase tracking-wider opacity-60">${t.role === 'ai' ? 'AI receptionist (simulated)' : 'Customer'}</div><pre class="wrap">${esc(t.text)}</pre></div></div>`).join('')}${a.busy ? '<div class="text-xs text-zinc-400"><span class="spin"></span></div>' : ''}</div>
        ${s.stage === 'offering' ? `<div class="flex flex-wrap gap-2 border-t border-zinc-100 px-4 py-3">${s.options.map((o, i) => `<button class="btn btn-violet !normal-case" data-pick="${o.id}" ${a.busy ? 'disabled' : ''}>Option ${i + 1}</button>`).join('')}<span class="self-center text-[11px] text-zinc-400">or type another day/time below</span></div>` : ''}
        ${over ? `<div class="border-t border-zinc-100 px-4 py-3"><button class="btn btn-violet" id="agentAgain">Start another call</button></div>` : `<form id="agentForm" class="flex gap-2 border-t border-zinc-100 p-3"><input class="field" name="text" maxlength="600" autocomplete="off" placeholder="Type what the customer says…" aria-label="Customer message" ${a.busy ? 'disabled' : ''}><button class="btn btn-primary" ${a.busy ? 'disabled' : ''}>Send</button><button type="button" class="btn btn-ghost" id="hangup" ${a.busy ? 'disabled' : ''}>Hang up</button></form>${s.scenario ? `<div class="flex flex-wrap items-center gap-2 border-t border-zinc-100 px-4 py-2 text-[11px] text-zinc-500">Suggested lines: ${(a.scenarios.find((x) => x.id === s.scenario)?.script || []).map((l) => `<button class="rounded-lg border border-zinc-200 px-2 py-1 text-left hover:bg-zinc-50" data-say="${esc(l)}">${esc(l)}</button>`).join('')}</div>` : ''}`}
      </section>
      <section class="space-y-4 xl:col-span-2"><div class="card p-4"><h2 class="mb-3 text-sm font-semibold">Agent workflow</h2><ol class="space-y-2">${s.steps.map((st) => `<li class="flex gap-2.5 text-xs"><span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full text-[10px] font-bold ${tone[st.status]}">${icon[st.status]}</span><div class="min-w-0"><div class="font-medium ${st.status === 'pending' ? 'text-zinc-400' : ''}">${esc(st.label)}</div>${st.detail ? `<div class="text-[11px] leading-4 text-zinc-500">${esc(st.detail)}</div>` : ''}</div></li>`).join('')}</ol></div>
      ${s.plan && s.stage === 'offering' ? `<div class="card p-4"><h2 class="mb-2 text-sm font-semibold">Inventory check & sourcing</h2>${s.plan.parts.length ? partsTable(s.plan.parts) : '<p class="text-xs text-zinc-500">No parts needed.</p>'}${s.plan.missing.length ? `<p class="mt-2 rounded-lg bg-amber-50 px-3 py-2 text-[11px] text-amber-900">Missing parts will be added to a parts request for a human to approve. Demo prices only.</p>` : ''}</div>` : ''}
      ${r ? `<div class="card border-emerald-200 p-4"><h2 class="mb-2 text-sm font-semibold">Summary of actions taken</h2><ul class="list-disc space-y-1 pl-4 text-xs">${r.actions.map((x) => `<li>${esc(x)}</li>`).join('')}</ul><div class="mt-3 flex flex-wrap gap-2 text-xs">${r.callId ? `<button class="btn btn-ghost" data-call="${r.callId}">Open call record</button>` : ''}${r.customerId ? `<button class="btn btn-ghost" data-customer="${r.customerId}">Open customer</button>` : ''}${r.bookingIds.length ? `<button class="btn btn-ghost" data-booking="${r.bookingIds[0]}">Open appointment</button>` : ''}${r.requestId ? `<button class="btn btn-ghost" data-request="${r.requestId}">Open parts request</button>` : ''}<button class="btn btn-ghost" data-go="calendar">Calendar</button><button class="btn btn-ghost" data-go="dashboard">Dashboard</button></div><p class="mt-2 text-[10px] text-zinc-400">${r.taskIds.length} follow-up task(s) created. Nothing was ordered.</p></div>` : ''}</section></div>`;
  }
  function paintAgent() { if (S.view !== 'agent') return; $('#content').innerHTML = renderAgent(); const l = $('#chatLog'); if (l) l.scrollTop = l.scrollHeight; const f = $('#agentForm input'); if (f && !S.agent.busy) f.focus(); }
  async function agentCall(fn) {
    if (S.agent.busy) return; S.agent.busy = true; paintAgent();
    try { S.agent.session = await fn(); } catch (e) { if (e.status !== 401) toast(e.message, 'err'); }
    finally { S.agent.busy = false; paintAgent(); }
  }
  document.addEventListener('click', (e) => {
    if (S.view !== 'agent') return;
    const sc = e.target.closest('[data-scenario]'); if (sc) { const x = S.agent.scenarios.find((y) => y.id === sc.dataset.scenario); agentCall(() => api('/agent/sessions', { method: 'POST', body: { scenario: x.id, callerId: x.callerId } })); return; }
    if (e.target.closest('#agentBack') || e.target.closest('#agentAgain')) { S.agent.session = null; paintAgent(); return; }
    const pick = e.target.closest('[data-pick]'); if (pick) { agentCall(() => api(`/agent/sessions/${S.agent.session.id}/choose`, { method: 'POST', body: { optionId: pick.dataset.pick } })); return; }
    const say = e.target.closest('[data-say]'); if (say) { const i = $('#agentForm input'); if (i) { i.value = say.dataset.say; i.focus(); } return; }
    if (e.target.closest('#hangup')) agentCall(() => api(`/agent/sessions/${S.agent.session.id}/end`, { method: 'POST', body: {} }));
  });
  document.addEventListener('submit', (e) => {
    if (S.view !== 'agent') return;
    if (e.target.id === 'agentForm') { e.preventDefault(); const text = new FormData(e.target).get('text').trim(); if (!text) return; const s = S.agent.session; s.transcript.push({ role: 'customer', text }); agentCall(() => api(`/agent/sessions/${s.id}/messages`, { method: 'POST', body: { text } })); }
    if (e.target.id === 'customCall') { e.preventDefault(); const callerId = new FormData(e.target).get('callerId').trim(); agentCall(() => api('/agent/sessions', { method: 'POST', body: { callerId } })); }
  });

  // --------------------------------------------------------------- boot
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view && !$('#portal').classList.contains('hidden')) go(v, false); });
  (async function boot() {
    if (!sessionStorage.getItem(TOKEN_KEY)) { showLogin(); return; }
    try { await showPortal(); } catch (e) { if (e.status !== 401) { toast(e.message, 'err'); } }
  })();
})();
</script>
</body>
</html>
